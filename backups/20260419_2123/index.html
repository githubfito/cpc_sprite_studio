<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>CPC Sprite Studio - Ultimate</title>
    <style>
        :root { --cpc-cyan: #00adef; --cpc-dark: #111; }
        body { font-family: 'Courier New', monospace; background: var(--cpc-dark); color: #eee; margin: 0; display: flex; flex-direction: column; align-items: center; }
        header { background: #000; width: 100%; padding: 10px; border-bottom: 2px solid var(--cpc-cyan); text-align: center; box-shadow: 0 2px 10px #000; }
        
        .toolbar { display: flex; flex-wrap: wrap; gap: 15px; background: #222; padding: 15px; border-bottom: 1px solid #444; justify-content: center; align-items: center; }
        .group { display: flex; align-items: center; gap: 8px; border-right: 1px solid #444; padding-right: 12px; font-size: 14px; }
        .group:last-child { border: none; }
        
        #canvas-wrapper { background: #333; padding: 20px; max-width: 95vw; max-height: 50vh; overflow: auto; margin: 20px 0; border: 1px solid #555; box-shadow: inset 0 0 15px #000; }
        
        .grid { 
            display: grid; 
            background: #000; 
            position: relative; 
            border: 1px solid #000; 
            width: fit-content; 
        }
        
        .pixel { border: 0.1px solid rgba(255,255,255,0.05); box-sizing: border-box; }
        .f-guide { position: absolute; top: 0; bottom: 0; width: 2px; background: rgba(255, 165, 0, 0.7); pointer-events: none; z-index: 10; box-shadow: 0 0 5px rgba(255, 165, 0, 0.5); }

        /* Ratios Amstrad CPC reales */
        .m0 .pixel { width: 24px; height: 12px; }
        .m1 .pixel { width: 12px; height: 12px; }
        .m2 .pixel { width: 6px; height: 12px; }

        .pal { display: flex; gap: 4px; margin: 10px; background: #000; padding: 5px; border: 1px solid #444; }
        .c-box { width: 30px; height: 30px; border: 2px solid #444; cursor: pointer; transition: 0.1s; }
        .c-box.sel { border-color: #fff; outline: 2px solid var(--cpc-cyan); transform: scale(1.1); z-index: 5; }
        
        button { background: #444; color: #fff; border: 1px solid #666; padding: 8px 15px; cursor: pointer; font-weight: bold; }
        button:hover { background: #555; border-color: var(--cpc-cyan); }
        button.play { background: var(--cpc-cyan); color: #000; border: none; }
        
        #overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 1000; flex-direction: column; justify-content: center; align-items: center; }
        #canv-cont { border: 4px solid #444; background: #000; image-rendering: pixelated; padding: 5px; }
        
        .tips { font-size: 12px; color: #888; margin: 10px; text-align: center; max-width: 600px; line-height: 1.4; }
    </style>
</head>
<body>

<header><h1>CPC SPRITE STUDIO</h1></header>

<div class="toolbar">
    <div class="group">
        FRAME: <input type="number" id="fw" value="16" style="width:45px"> x <input type="number" id="fh" value="16" style="width:45px">
    </div>
    <div class="group">
        Nº FRAMES: <input type="number" id="nf" value="2" style="width:40px">
    </div>
    <div class="group">
        MODO: 
        <select id="mode">
            <option value="0">0 (16 col)</option>
            <option value="1" selected>1 (4 col)</option>
            <option value="2">2 (2 col)</option>
        </select>
    </div>
    <button class="play" id="btn-res">GENERAR</button>
    <button id="btn-anim">ANIMAR</button>
    <button id="btn-exp" style="background:#27ae60">EXPORT DATA</button>
</div>

<div id="pal" class="pal"></div>

<div id="canvas-wrapper">
    <div id="grid" class="grid"></div>
</div>

<div class="tips">
    <b>Instrucciones:</b> Define el tamaño de un solo frame y cuántos quieres. El lienzo crecerá solo.<br>
    Las líneas naranjas separan cada frame. Pulsa ANIMAR para ver la secuencia.
</div>

<div id="overlay">
    <h2 style="color:var(--cpc-cyan)">PREVIEW</h2>
    <div id="canv-cont"><canvas id="canvas"></canvas></div>
    <button onclick="closeAnim()" style="margin-top:20px; background:#f00; color:white; border:none; padding:10px 20px; cursor:pointer; font-weight:bold;">CERRAR</button>
</div>

<script src="script.js"></script>
</body>
</html>
