<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CPC Sprite Studio - Zoom & Pan Pro</title>
    <style>
        :root { --cpc-cyan: #00adef; --cpc-dark: #111; --sidebar-w: 65px; }
        body { font-family: 'Courier New', monospace; background: var(--cpc-dark); color: #eee; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { background: #000; width: 100%; padding: 10px 0; border-bottom: 2px solid var(--cpc-cyan); text-align: center; flex-shrink: 0; z-index: 100; }
        
        .main-container { display: flex; flex: 1; overflow: hidden; position: relative; }
        .sidebar { width: var(--sidebar-w); background: #222; border-right: 1px solid #444; display: flex; flex-direction: column; align-items: center; padding: 15px 0; gap: 12px; flex-shrink: 0; z-index: 90; }
        
        .side-btn { width: 44px; height: 44px; background: #333; border: 1px solid #555; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; transition: 0.2s; position: relative; }
        .side-btn:hover { background: var(--cpc-cyan); color: #000; border-color: #fff; }
        .side-btn::after { content: attr(title); position: absolute; left: 60px; background: #000; color: #fff; padding: 5px; font-size: 10px; white-space: nowrap; display: none; z-index: 100; border: 1px solid var(--cpc-cyan); }
        .side-btn:hover::after { display: block; }
        .side-btn.save { color: #2ecc71; }
        .side-btn.load { color: #f1c40f; }
        
        .workspace { flex: 1; position: relative; overflow: hidden; background: #333; display: flex; flex-direction: column; }
        
        /* Top UI stays fixed */
        .toolbar { display: flex; flex-wrap: wrap; gap: 15px; background: #222; padding: 10px 20px; border-bottom: 1px solid #444; justify-content: center; align-items: center; width: 100%; box-sizing: border-box; z-index: 80; }
        .group { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; border-right: 1px solid #444; padding-right: 12px; }
        .group:last-child { border: none; }
        .label-row { display: flex; align-items: center; gap: 8px; font-size: 13px; }
        #byte-info { font-size: 9px; color: var(--cpc-cyan); font-style: italic; }

        input, select { background: #000; color: #fff; border: 1px solid #555; padding: 2px; font-family: monospace; }

        /* The Viewport handles Pan & Zoom */
        #viewport { flex: 1; overflow: hidden; cursor: crosshair; position: relative; display: flex; justify-content: center; align-items: center; }
        #canvas-panner { position: absolute; transform-origin: center; display: flex; justify-content: center; align-items: center; transition: none; will-change: transform; }
        
        .grid { display: grid; background: #000; position: relative; border: 2px solid #555; box-shadow: 0 0 50px rgba(0,0,0,0.5); }
        .pixel { border: 1px solid rgba(255,255,255,0.05); box-sizing: border-box; }
        .f-guide { position: absolute; top: 0; bottom: 0; width: 2px; background: rgba(255, 165, 0, 0.8); pointer-events: none; z-index: 10; }

        .m0 .pixel { width: 24px; height: 12px; }
        .m1 .pixel { width: 12px; height: 12px; }
        .m2 .pixel { width: 6px; height: 12px; }

        .pal { display: flex; gap: 4px; padding: 10px; background: #000; border-top: 1px solid #444; width: 100%; justify-content: center; z-index: 80; }
        .c-box { width: 25px; height: 25px; border: 2px solid #444; cursor: pointer; }
        .c-box.sel { border-color: #fff; outline: 2px solid var(--cpc-cyan); }

        /* Modals and floating windows */
        #anim-window { display: none; position: fixed; top: 150px; left: 150px; background: #000; border: 3px solid var(--cpc-cyan); z-index: 2000; box-shadow: 0 0 30px #000; }
        .win-header { background: var(--cpc-cyan); color: #000; padding: 5px 10px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; cursor: move; user-select: none; }
        .win-body { padding: 15px; display: flex; flex-direction: column; align-items: center; }
        #canvas { image-rendering: pixelated; background: #000; }
        
        .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 1000; flex-direction: column; justify-content: center; align-items: center; }
        .modal { background: #222; padding: 30px; border: 2px solid var(--cpc-cyan); display: flex; flex-direction: column; gap: 15px; width: 420px; text-align: center; }
        .modal button { background: #333; border: 1px solid #555; padding: 10px; color: white; cursor: pointer; font-weight: bold; }
        .modal button:hover { background: #444; border-color: var(--cpc-cyan); }
    </style>
</head>
<body>

<header><h1>CPC SPRITE STUDIO</h1></header>

<div class="main-container">
    <aside class="sidebar">
        <button class="side-btn save" onclick="saveProject()" title="Save Project (.json)"><i>💾</i></button>
        <button class="side-btn load" onclick="triggerLoad()" title="Load Project (.json)"><i>📂</i></button>
        <input type="file" id="load-input" style="display:none" accept=".json" onchange="loadProject(this)">
        <hr style="width:70%; border:0; border-top:1px solid #444;">
        <button class="side-btn" onclick="openFrameModal()" title="Add New Frame"><i>+F</i></button>
        <button class="side-btn" onclick="openDelFrameModal()" title="Delete Frame (Physical)"><i>-F</i></button>
        <button class="side-btn" onclick="clearFrame()" title="Clear Frame Content"><i>F✂</i></button>
        <button class="side-btn" onclick="cloneFrame()" title="Clone Frame"><i>C⎘</i></button>
        <button class="side-btn" onclick="flipH()" title="Horizontal Mirror"><i>↔</i></button>
        <button class="side-btn" onclick="flipV()" title="Vertical Mirror"><i>↕</i></button>
        <button class="side-btn" onclick="rotate90()" title="Rotate 90º Right"><i>⟳</i></button>
        <button class="side-btn" onclick="initGrid(true)" title="Wipe Entire Canvas"><i>♻</i></button>
    </aside>

    <div class="workspace">
        <div class="toolbar">
            <div class="group">
                <div class="label-row">DIM: <input type="number" id="fw" value="16" class="auto-gen" style="width:40px">x<input type="number" id="fh" value="16" class="auto-gen" style="width:40px"></div>
            </div>
            <div class="group">
                <div class="label-row">FRAMES: <input type="number" id="nf" value="4" class="auto-gen" style="width:35px"></div>
            </div>
            <div class="group">
                <div class="label-row">MODE: 
                    <select id="mode" class="auto-gen">
                        <option value="0">0</option>
                        <option value="1" selected>1</option>
                        <option value="2">2</option>
                    </select>
                </div>
                <div id="byte-info">1 byte = 4 pixels</div>
            </div>
            <div class="group">
                <div class="label-row" style="color:var(--cpc-cyan); font-weight:bold;">
                    ZOOM: <span id="zoom-label">100%</span>
                </div>
                <div style="font-size:9px;">Wheel to Zoom | Mid-Click to Pan</div>
            </div>
            <button class="play" onclick="initGrid(true)">GENERATE</button>
            <button onclick="playAnim()">ANIMATE</button>
            <button onclick="showExportMenu()" style="background:#27ae60">DATA</button>
        </div>

        <div id="viewport">
            <div id="canvas-panner">
                <div id="grid" class="grid"></div>
            </div>
        </div>

        <div id="pal" class="pal"></div>
    </div>
</div>

<div id="anim-window">
    <div id="win-handle" class="win-header"><span>ANIMATOR</span><button onclick="closeAnim()" style="background:#f00; border:none; padding:2px 8px; color:#fff; cursor:pointer;">X</button></div>
    <div class="win-body"><canvas id="canvas"></canvas></div>
    <div id="anim-status" style="text-align:center; padding:5px; font-size:11px; color:#fff;"></div>
    <div style="background:#222; padding:5px; font-size:10px; text-align:center; color:var(--cpc-cyan);">[+] [-] Speed | [0-9] Zoom | [ESC] Close</div>
</div>

<div id="frame-modal" class="overlay">
    <div class="modal">
        <h2>ADD FRAME</h2>
        <button onclick="addFrame('end')">AT THE END</button>
        <button onclick="addFrame('start')">AT THE START</button>
        <button onclick="addFrame('custom')">CUSTOM POSITION</button>
        <button onclick="closeFrameModal()" style="background:#500; margin-top:10px;">CANCEL</button>
    </div>
</div>

<div id="del-frame-modal" class="overlay">
    <div class="modal">
        <h2 style="color:#f66;">DELETE FRAME</h2>
        <button onclick="removeFrame('end')">THE LAST ONE</button>
        <button onclick="removeFrame('start')">THE FIRST ONE</button>
        <button onclick="removeFrame('custom')">SPECIFIC POSITION</button>
        <button onclick="closeDelFrameModal()" style="background:#444; margin-top:10px;">CANCEL</button>
    </div>
</div>

<div id="export-overlay" class="overlay">
    <div class="export-menu modal">
        <h2>EXPORT DATA</h2>
        <div style="background:#333; padding:10px; margin-bottom:10px; font-size:12px;">
            Num Format: <label><input type="radio" name="num-format" value="hex" checked> Hex</label> <label><input type="radio" name="num-format" value="dec"> Dec</label>
        </div>
        <button onclick="doExport(1)">1) BASIC DATA</button>
        <button onclick="doExport(2)">2) 8BP ASM (ROW-ALIGNED)</button>
        <button onclick="doExport(3)">3) BINARY DUMP</button>
        <button onclick="closeExport()" style="background:#500; margin-top:10px; color:white">CANCEL</button>
    </div>
</div>

<script>
const cpcPal = ["#000000","#000080","#0000FF","#800000","#800080","#8000FF","#FF0000","#FF0080","#FF00FF","#008000","#008080","#0080FF","#808000","#808080","#8080FF","#FF8000","#FF8080","#FF80FF","#00FF00","#00FF80","#00FFFF","#80FF00","#80FF80","#80FFFF","#FFFF00","#FFFF80","#FFFFFF"];
let mode = 1, pen = 0, drawing = false, timer = null, animSpeed = 800, animZoom = 4;

// PAN & ZOOM LOGIC
let scale = 1, posX = 0, posY = 0, isPanning = false;
const viewport = document.getElementById('viewport');
const panner = document.getElementById('canvas-panner');

viewport.addEventListener('wheel', (e) => {
    e.preventDefault();
    const delta = e.deltaY > 0 ? 0.9 : 1.1;
    scale = Math.min(Math.max(0.1, scale * delta), 10);
    updateTransform();
}, {passive: false});

viewport.addEventListener('mousedown', (e) => {
    if (e.button === 1 || (e.button === 0 && e.altKey)) { // Middle click or Alt+Left
        isPanning = true;
        viewport.style.cursor = 'grabbing';
    }
});

window.addEventListener('mousemove', (e) => {
    if (!isPanning) return;
    posX += e.movementX;
    posY += e.movementY;
    updateTransform();
});

window.addEventListener('mouseup', () => {
    isPanning = false;
    viewport.style.cursor = 'crosshair';
});

function updateTransform() {
    panner.style.transform = `translate(${posX}px, ${posY}px) scale(${scale})`;
    document.getElementById('zoom-label').innerText = Math.round(scale * 100) + "%";
}

// REST OF THE FUNCTIONS
function getModeColors() {
    if (mode == 1) return ["#000080", "#FFFF00", "#0000FF", "#FF0000"];
    if (mode == 2) return ["#000080", "#FFFF00"];
    return ["#000080","#FFFF00","#00FFFF","#FF00FF","#000000","#000080","#0000FF","#800000","#800080","#8000FF","#FF0000","#FF0080","#FF00FF","#008000","#008080","#0080FF"];
}

function updateByteInfo() {
    const info = document.getElementById('byte-info'), m = parseInt(document.getElementById('mode').value);
    info.innerText = m === 0 ? "1 byte = 2 pixels" : (m === 1 ? "1 byte = 4 pixels" : "1 byte = 8 pixels");
}

function initGrid(confirmNeeded = false) {
    if (confirmNeeded) {
        let modified = Array.from(document.querySelectorAll('.pixel')).some(p => parseInt(p.dataset.pen) !== 0);
        if (modified && !confirm("Wipe canvas?")) return;
    }
    mode = parseInt(document.getElementById('mode').value);
    updateByteInfo();
    const fw = parseInt(document.getElementById('fw').value), fh = parseInt(document.getElementById('fh').value), nf = parseInt(document.getElementById('nf').value);
    const totalW = fw * nf, g = document.getElementById('grid'), colors = getModeColors();
    pen = 0; buildPal();
    g.innerHTML = ''; g.className = `grid m${mode}`;
    g.style.gridTemplateColumns = `repeat(${totalW}, auto)`;
    const frag = document.createDocumentFragment();
    for (let i = 0; i < totalW * fh; i++) {
        const p = document.createElement('div');
        p.className = 'pixel'; p.style.background = colors[0]; p.dataset.pen = 0;
        p.onmousedown = (e) => { if(e.button === 0 && !e.altKey) { drawing = true; paint(p); } };
        p.onmouseenter = () => { if(drawing) paint(p); };
        frag.appendChild(p);
    }
    g.appendChild(frag);
    for (let i = 1; i < nf; i++) {
        const guide = document.createElement('div');
        guide.className = 'f-guide'; guide.style.left = (i * fw * (mode==0?24:mode==1?12:6)) + "px";
        g.appendChild(guide);
    }
}

// Persistencia
function saveProject() {
    const data = {
        config: { fw: parseInt(document.getElementById('fw').value), fh: parseInt(document.getElementById('fh').value), nf: parseInt(document.getElementById('nf').value), mode: mode, speed: animSpeed },
        pixels: Array.from(document.querySelectorAll('.pixel')).map(p => parseInt(p.dataset.pen))
    };
    const blob = new Blob([JSON.stringify(data)], {type: "application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = "sprite.json"; a.click();
}
function triggerLoad() { document.getElementById('load-input').click(); }
function loadProject(input) {
    const file = input.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
        const d = JSON.parse(e.target.result);
        document.getElementById('fw').value = d.config.fw; document.getElementById('fh').value = d.config.fh;
        document.getElementById('nf').value = d.config.nf; document.getElementById('mode').value = d.config.mode;
        initGrid(false);
        const px = document.querySelectorAll('.pixel'), clr = getModeColors();
        d.pixels.forEach((v, i) => { if(px[i]) { px[i].dataset.pen = v; px[i].style.background = clr[v]; } });
        input.value = "";
    };
    reader.readAsText(file);
}

// Utils
function paint(el) { el.style.background = getModeColors()[pen]; el.dataset.pen = pen; }
function buildPal() {
    const box = document.getElementById('pal'); box.innerHTML = '';
    getModeColors().forEach((c, i) => {
        let d = document.createElement('div'); d.className = 'c-box' + (i == pen ? ' sel' : '');
        d.style.background = c; d.onclick = () => { pen = i; buildPal(); }; box.appendChild(d);
    });
}

function getFullSpriteData() {
    const fw = parseInt(document.getElementById('fw').value), fh = parseInt(document.getElementById('fh').value), nf = parseInt(document.getElementById('nf').value), totalW = fw * nf;
    const pixels = document.querySelectorAll('.pixel');
    let allFrames = [];
    for (let f = 0; f < nf; f++) {
        let frame = [];
        for (let y = 0; y < fh; y++) {
            let row = [];
            for (let x = 0; x < fw; x++) row.push(parseInt(pixels[(y * totalW) + (f * fw) + x].dataset.pen));
            frame.push(row);
        }
        allFrames.push(frame);
    }
    return allFrames;
}

function restoreData(allData) {
    document.getElementById('nf').value = allData.length;
    initGrid(false);
    const fw = parseInt(document.getElementById('fw').value), totalW = fw * allData.length, px = document.querySelectorAll('.pixel'), clr = getModeColors();
    allData.forEach((frame, fIdx) => { frame.forEach((row, y) => { row.forEach((v, x) => {
        const p = px[(y * totalW) + (fIdx * fw) + x]; if(p){ p.dataset.pen = v; p.style.background = clr[v]; }
    }); }); });
}

function openFrameModal() { document.getElementById('frame-modal').style.display = 'flex'; }
function closeFrameModal() { document.getElementById('frame-modal').style.display = 'none'; }
function openDelFrameModal() { document.getElementById('del-frame-modal').style.display = 'flex'; }
function closeDelFrameModal() { document.getElementById('del-frame-modal').style.display = 'none'; }

function addFrame(pos) {
    let all = getFullSpriteData();
    let n = Array(parseInt(document.getElementById('fh').value)).fill().map(() => Array(parseInt(document.getElementById('fw').value)).fill(0));
    if (pos === 'end') all.push(n); else if (pos === 'start') all.unshift(n);
    else { let i = prompt(`Position (1 to ${all.length+1})`); if(i) all.splice(parseInt(i)-1,0,n); }
    restoreData(all); closeFrameModal();
}

function removeFrame(pos) {
    let all = getFullSpriteData(); if (all.length <= 1) return;
    if (pos === 'end') all.pop(); else if (pos === 'start') all.shift();
    else { let i = prompt(`Index (1 to ${all.length})`); if(i) all.splice(parseInt(i)-1,1); }
    restoreData(all); closeDelFrameModal();
}

function clearFrame() {
    let f = prompt("Frame number (1 to " + document.getElementById('nf').value + ")") - 1;
    if (f >= 0) {
        const fw = parseInt(document.getElementById('fw').value), fh = parseInt(document.getElementById('fh').value), tw = fw * parseInt(document.getElementById('nf').value);
        const px = document.querySelectorAll('.pixel'), clr = getModeColors();
        for(let y=0; y<fh; y++) for(let x=0; x<fw; x++) { const p = px[(y * tw) + (f * fw) + x]; p.dataset.pen = 0; p.style.background = clr[0]; }
    }
}

function cloneFrame() {
    let o = prompt("Source frame (1-N)") - 1, d = prompt("Dest frame (1-N)") - 1;
    if (o >= 0 && d >= 0) {
        const fw = parseInt(document.getElementById('fw').value), fh = parseInt(document.getElementById('fh').value), tw = fw * parseInt(document.getElementById('nf').value);
        const px = document.querySelectorAll('.pixel'), clr = getModeColors();
        for(let y=0; y<fh; y++) for(let x=0; x<fw; x++) {
            let v = px[(y*tw)+(o*fw)+x].dataset.pen; let p = px[(y*tw)+(d*fw)+x]; p.dataset.pen = v; p.style.background = clr[v];
        }
    }
}

function flipH() {
    let f = prompt("Frame (1-N)") - 1;
    if(f >= 0) {
        const fw = parseInt(document.getElementById('fw').value), fh = parseInt(document.getElementById('fh').value), tw = fw * parseInt(document.getElementById('nf').value);
        const px = document.querySelectorAll('.pixel'), clr = getModeColors();
        for(let y=0; y<fh; y++) {
            let row = []; for(let x=0; x<fw; x++) row.push(px[(y*tw)+(f*fw)+x].dataset.pen);
            row.reverse().forEach((v, x) => { let p = px[(y*tw)+(f*fw)+x]; p.dataset.pen = v; p.style.background = clr[v]; });
        }
    }
}

function flipV() {
    let f = prompt("Frame (1-N)") - 1;
    if(f >= 0) {
        const fw = parseInt(document.getElementById('fw').value), fh = parseInt(document.getElementById('fh').value), tw = fw * parseInt(document.getElementById('nf').value);
        const px = document.querySelectorAll('.pixel'), clr = getModeColors();
        let frame = [];
        for(let y=0; y<fh; y++){ let r = []; for(let x=0; x<fw; x++) r.push(px[(y*tw)+(f*fw)+x].dataset.pen); frame.push(r); }
        frame.reverse().forEach((r, y) => r.forEach((v, x) => { let p = px[(y*tw)+(f*fw)+x]; p.dataset.pen = v; p.style.background = clr[v]; }));
    }
}

function rotate90() {
    let f = prompt("Frame (1-N)") - 1;
    const fw = parseInt(document.getElementById('fw').value), fh = parseInt(document.getElementById('fh').value);
    if(f >= 0 && fw == fh) {
        const tw = fw * parseInt(document.getElementById('nf').value), px = document.querySelectorAll('.pixel'), clr = getModeColors();
        let old = [];
        for(let y=0; y<fh; y++){ let r = []; for(let x=0; x<fw; x++) r.push(px[(y*tw)+(f*fw)+x].dataset.pen); old.push(r); }
        for(let y=0; y<fh; y++) for(let x=0; x<fw; x++) { let v = old[fh-1-x][y]; let p = px[(y*tw)+(f*fw)+x]; p.dataset.pen = v; p.style.background = clr[v]; }
    } else { alert("Only square frames"); }
}

function playAnim() { document.getElementById('anim-window').style.display = 'block'; renderFrame(); }
function closeAnim() { clearInterval(timer); document.getElementById('anim-window').style.display='none'; }
function renderFrame() {
    const fw = parseInt(document.getElementById('fw').value), fh = parseInt(document.getElementById('fh').value), nf = parseInt(document.getElementById('nf').value), tw = fw * nf;
    const canv = document.getElementById('canvas'), ctx = canv.getContext('2d'), px = document.querySelectorAll('.pixel');
    canv.width = fw; canv.height = fh;
    let r = mode == 0 ? 2 : (mode == 1 ? 1 : 0.5);
    canv.style.width = (fw * r * animZoom * 2) + "px"; canv.style.height = (fh * animZoom * 2) + "px";
    document.getElementById('anim-status').innerText = `Speed: ${animSpeed}ms | Zoom: x${animZoom}`;
    let f = 0; if(timer) clearInterval(timer);
    timer = setInterval(() => {
        ctx.clearRect(0,0,fw,fh);
        for(let y=0; y<fh; y++) for(let x=0; x<fw; x++) {
            const idx = y * tw + (f * fw + x); if(px[idx]){ ctx.fillStyle = px[idx].style.background; ctx.fillRect(x,y,1,1); }
        }
        f = (f + 1) % nf;
    }, animSpeed);
}

function packCpcByte(pens) {
    let b = 0;
    if (mode == 1) { 
        if (pens[0] & 1) b |= 128; if (pens[0] & 2) b |= 8; if (pens[1] & 1) b |= 64;  if (pens[1] & 2) b |= 4;
        if (pens[2] & 1) b |= 32;  if (pens[2] & 2) b |= 2; if (pens[3] & 1) b |= 16;  if (pens[3] & 2) b |= 1;
    } else if (mode == 0) { 
        if (pens[0] & 1) b |= 128; if (pens[0] & 2) b |= 8; if (pens[0] & 4) b |= 32; if (pens[0] & 8) b |= 2;
        if (pens[1] & 1) b |= 64;  if (pens[1] & 2) b |= 4; if (pens[1] & 4) b |= 16; if (pens[1] & 8) b |= 1;
    } else { for(let i=0; i<8; i++) if(pens[i] & 1) b |= (1 << (7-i)); }
    return b;
}

function doExport(type) {
    const fw = parseInt(document.getElementById('fw').value), fh = parseInt(document.getElementById('fh').value), nf = parseInt(document.getElementById('nf').value), totalW = fw * nf;
    const data = Array.from(document.querySelectorAll('.pixel')).map(p => parseInt(p.dataset.pen));
    const step = mode == 1 ? 4 : (mode == 0 ? 2 : 8), isHex = document.querySelector('input[name="num-format"]:checked').value === "hex";
    const fmt = (n) => isHex ? "&" + n.toString(16).toUpperCase().padStart(2, '0') : n.toString();
    let res = "";
    if(type === 1) {
        const bytes = []; for(let i=0; i<data.length; i+=step) bytes.push(packCpcByte(data.slice(i, i+step)));
        for(let i=0; i<bytes.length; i+=8) res += (100+i) + " DATA " + bytes.slice(i, i+8).map(fmt).join(",") + "\n";
    } else if(type === 2) {
        for (let f = 0; f < nf; f++) {
            res += "\n.frame" + (f+1) + "\n";
            for (let y = 0; y < fh; y++) {
                let rowBytes = []; let rStart = (y*totalW)+(f*fw); let rowPixels = data.slice(rStart, rStart+fw);
                for (let i = 0; i < rowPixels.length; i += step) rowBytes.push(packCpcByte(rowPixels.slice(i, i + step)));
                res += "  DB " + rowBytes.map(fmt).join(",") + " ; Row " + y + "\n";
            }
        }
    } else {
        const bytes = []; for(let i=0; i<data.length; i+=step) bytes.push(packCpcByte(data.slice(i, i+step)));
        res = bytes.map(fmt).join(" ");
    }
    const w = window.open(); w.document.write("<pre>" + res + "</pre>");
}

function showExportMenu() { document.getElementById('export-overlay').style.display = 'flex'; }
function closeExport() { document.getElementById('export-overlay').style.display = 'none'; }

// Drag floating anim window
const animWin = document.getElementById('anim-window'), handle = document.getElementById('win-handle');
let isAnimDragging = false, animOffset = [0,0];
handle.onmousedown = (e) => { isAnimDragging = true; animOffset = [animWin.offsetLeft - e.clientX, animWin.offsetTop - e.clientY]; };
document.addEventListener('mousemove', (e) => { 
    if (isAnimDragging) { animWin.style.left = (e.clientX + animOffset[0]) + 'px'; animWin.style.top = (e.clientY + animOffset[1]) + 'px'; } 
});
document.addEventListener('mouseup', () => { isAnimDragging = false; drawing = false; });

window.onkeydown = (e) => {
    if (document.getElementById('anim-window').style.display === 'block') {
        if (e.key === 'Escape') closeAnim();
        if (e.key === '+' || e.key === '=') { animSpeed = Math.max(10, animSpeed - 10); renderFrame(); }
        if (e.key === '-' || e.key === '_') { animSpeed = Math.min(2000, animSpeed + 10); renderFrame(); }
        if (e.key >= '0' && e.key <= '9') { animZoom = e.key === '0' ? 12 : parseInt(e.key); renderFrame(); }
    }
};

document.addEventListener("DOMContentLoaded", () => {
    initGrid(false);
    document.querySelectorAll('.auto-gen').forEach(input => {
        input.addEventListener('change', () => initGrid(true));
    });
});
</script>
