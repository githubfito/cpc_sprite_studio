<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>CPC Sprite Studio - Pro Fix</title>
    <style>
        :root { --cpc-cyan: #00adef; --cpc-dark: #111; }
        body { font-family: 'Courier New', monospace; background: var(--cpc-dark); color: #eee; margin: 0; display: flex; flex-direction: column; align-items: center; }
        header { background: #000; width: 100%; padding: 10px; border-bottom: 2px solid var(--cpc-cyan); text-align: center; }
        
        .toolbar { display: flex; flex-wrap: wrap; gap: 15px; background: #222; padding: 15px; border-bottom: 1px solid #444; justify-content: center; align-items: center; }
        .group { display: flex; align-items: center; gap: 8px; border-right: 1px solid #444; padding-right: 12px; font-size: 14px; }
        
        #canvas-wrapper { background: #333; padding: 20px; max-width: 95vw; max-height: 50vh; overflow: auto; margin: 20px 0; border: 1px solid #555; }
        .grid { display: grid; background: #000; position: relative; border: 2px solid #555; width: fit-content; margin: 0 auto; }
        .pixel { border: 1px solid rgba(255,255,255,0.05); box-sizing: border-box; }
        .f-guide { position: absolute; top: 0; bottom: 0; width: 2px; background: rgba(255, 165, 0, 0.8); pointer-events: none; z-index: 10; }

        .m0 .pixel { width: 24px; height: 12px; }
        .m1 .pixel { width: 12px; height: 12px; }
        .m2 .pixel { width: 6px; height: 12px; }

        .pal { display: flex; gap: 4px; margin: 10px; background: #000; padding: 10px; border: 1px solid #444; }
        .c-box { width: 30px; height: 30px; border: 2px solid #444; cursor: pointer; }
        .c-box.sel { border-color: #fff; outline: 2px solid var(--cpc-cyan); }
        
        button { background: #444; color: #fff; border: 1px solid #666; padding: 8px 15px; cursor: pointer; font-weight: bold; }
        button.play { background: var(--cpc-cyan); color: #000; border: none; }
        
        .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 1000; flex-direction: column; justify-content: center; align-items: center; }
        #canv-cont { border: 4px solid #444; background: #000; image-rendering: pixelated; position: relative; overflow: auto; max-width: 90vw; max-height: 70vh; padding: 20px; }
        
        #anim-info-bar { position: fixed; top: 0; width: 100%; background: rgba(0,0,0,0.9); color: var(--cpc-cyan); text-align: center; padding: 12px; font-size: 14px; border-bottom: 1px solid var(--cpc-cyan); z-index: 1100; }

        .export-menu { background: #222; padding: 30px; border: 2px solid var(--cpc-cyan); display: flex; flex-direction: column; gap: 10px; width: 420px; text-align: center; }
        .export-menu button { background: #333; border: 1px solid #555; text-align: left; padding: 12px; }
    </style>
</head>
<body>

    <header><h1>CPC SPRITE STUDIO</h1></header>

    <div class="toolbar">
        <div class="group">FRAME: <input type="number" id="fw" value="16" style="width:45px"> x <input type="number" id="fh" value="20" style="width:45px"></div>
        <div class="group">Nº FRAMES: <input type="number" id="nf" value="2" style="width:40px"></div>
        <div class="group">MODO: 
            <select id="mode" onchange="initGrid()">
                <option value="0">0 (16 col)</option>
                <option value="1" selected>1 (4 col)</option>
                <option value="2">2 (2 col)</option>
            </select>
        </div>
        <button class="play" onclick="initGrid()">GENERAR</button>
        <button onclick="playAnim()">ANIMAR</button>
        <button onclick="showExportMenu()" style="background:#27ae60">DATA / EXPORT</button>
    </div>

    <div id="pal" class="pal"></div>
    <div id="canvas-wrapper"><div id="grid" class="grid"></div></div>

    <div id="export-overlay" class="overlay">
        <div class="export-menu">
            <h2 style="color:var(--cpc-cyan); margin-top:0">EXPORTAR</h2>
            <button onclick="doExport(1)">1) DATA NORMALES (BASIC)</button>
            <button onclick="doExport(2)">2) FORMATO ASM (8BP images.asm)</button>
            <button onclick="doExport(3)">3) FORMATO .SCR (&C000)</button>
            <button onclick="closeExport()" style="background:#500; text-align:center; margin-top:10px; color:white">CANCELAR</button>
        </div>
    </div>

    <div id="anim-overlay" class="overlay">
        <div id="anim-info-bar">Velocidad: [+] [-] | Zoom: [0-9] | Tecla ESC para salir</div>
        <div id="canv-cont">
            <canvas id="canvas"></canvas>
        </div>
        <div id="anim-status" style="margin-top: 20px; color: var(--cpc-cyan); font-weight: bold;"></div>
        <button onclick="closeAnim()" style="margin-top:20px; background:#f00; border:none; color:white; padding:10px 20px; cursor:pointer; font-weight:bold;">CERRAR</button>
    </div>

    <script>
        const cpcPal = ["#000000","#000080","#0000FF","#800000","#800080","#8000FF","#FF0000","#FF0080","#FF00FF","#008000","#008080","#0080FF","#808000","#808080","#8080FF","#FF8000","#FF8080","#FF80FF","#00FF00","#00FF80","#00FFFF","#80FF00","#80FF80","#80FFFF","#FFFF00","#FFFF80","#FFFFFF"];
        let mode = 1, pen = 0, drawing = false, timer = null;
        let animSpeed = 150, animZoom = 4;

        function getModeColors() {
            if (mode == 1) return ["#000080", "#FFFF00", "#0000FF", "#FF0000"];
            if (mode == 2) return ["#000080", "#FFFF00"];
            return ["#000080","#FFFF00","#00FFFF","#FF00FF","#000000","#000080","#0000FF","#800000","#800080","#8000FF","#FF0000","#FF0080","#FF00FF","#008000","#008080","#0080FF"];
        }

        function buildPal() {
            const box = document.getElementById('pal'); box.innerHTML = '';
            let colors = getModeColors();
            colors.forEach((c, i) => {
                let d = document.createElement('div');
                d.className = 'c-box' + (i == pen ? ' sel' : '');
                d.style.background = c;
                d.onclick = () => { pen = i; buildPal(); };
                box.appendChild(d);
            });
        }

        function initGrid() {
            mode = parseInt(document.getElementById('mode').value);
            const fw = parseInt(document.getElementById('fw').value), fh = parseInt(document.getElementById('fh').value), nf = parseInt(document.getElementById('nf').value);
            const totalW = fw * nf, g = document.getElementById('grid'), colors = getModeColors();
            pen = 0; buildPal();
            g.innerHTML = ''; g.className = `grid m${mode}`;
            g.style.gridTemplateColumns = `repeat(${totalW}, auto)`;
            const fragment = document.createDocumentFragment();
            for (let i = 0; i < totalW * fh; i++) {
                const p = document.createElement('div');
                p.className = 'pixel'; p.style.background = colors[0]; p.dataset.pen = 0;
                p.onmousedown = (e) => { e.preventDefault(); drawing = true; paint(p); };
                p.onmouseenter = () => { if(drawing) paint(p); };
                fragment.appendChild(p);
            }
            g.appendChild(fragment);
            const pxSize = mode == 0 ? 24 : (mode == 1 ? 12 : 6);
            for (let i = 1; i < nf; i++) {
                const guide = document.createElement('div');
                guide.className = 'f-guide'; guide.style.left = (i * fw * pxSize) + "px";
                g.appendChild(guide);
            }
        }

        function paint(el) { el.style.background = getModeColors()[pen]; el.dataset.pen = pen; }

        function playAnim() { document.getElementById('anim-overlay').style.display = 'flex'; renderFrame(); }

        function renderFrame() {
            const fw = parseInt(document.getElementById('fw').value), fh = parseInt(document.getElementById('fh').value), nf = parseInt(document.getElementById('nf').value);
            const tw = fw * nf, canv = document.getElementById('canvas'), ctx = canv.getContext('2d'), pixels = document.querySelectorAll('.pixel');
            canv.width = fw; canv.height = fh;
            let ratio = mode == 0 ? 2 : (mode == 1 ? 1 : 0.5);
            canv.style.width = (fw * ratio * animZoom * 2) + "px"; 
            canv.style.height = (fh * animZoom * 2) + "px";
            document.getElementById('anim-status').innerText = `Vel: ${animSpeed}ms | Zoom: x${animZoom}`;
            let f = 0; if(timer) clearInterval(timer);
            timer = setInterval(() => {
                ctx.clearRect(0,0,fw,fh);
                for(let y = 0; y < fh; y++) for(let x = 0; x < fw; x++) {
                    const idx = y * tw + (f * fw + x);
                    if(pixels[idx]){ ctx.fillStyle = pixels[idx].style.background; ctx.fillRect(x,y,1,1); }
                }
                f = (f + 1) % nf;
            }, animSpeed);
        }

        window.onkeydown = (e) => {
            if (document.getElementById('anim-overlay').style.display === 'flex') {
                if (e.key === 'Escape') closeAnim();
                if (e.key === '+' || e.key === '=') { animSpeed = Math.max(10, animSpeed - 10); renderFrame(); }
                if (e.key === '-' || e.key === '_') { animSpeed = Math.min(2000, animSpeed + 10); renderFrame(); }
                if (e.key >= '0' && e.key <= '9') { animZoom = e.key === '0' ? 12 : parseInt(e.key); renderFrame(); }
            }
        };

        function packCpcByte(pens) {
            let b = 0;
            if (mode == 1) { // 4 píxeles (pens[0-3])
                if (pens[0] & 1) b |= 128; if (pens[0] & 2) b |= 8;
                if (pens[1] & 1) b |= 64;  if (pens[1] & 2) b |= 4;
                if (pens[2] & 1) b |= 32;  if (pens[2] & 2) b |= 2;
                if (pens[3] & 1) b |= 16;  if (pens[3] & 2) b |= 1;
            } else if (mode == 0) { // 2 píxeles (pens[0-1])
                if (pens[0] & 1) b |= 128; if (pens[0] & 2) b |= 8; if (pens[0] & 4) b |= 32; if (pens[0] & 8) b |= 2;
                if (pens[1] & 1) b |= 64;  if (pens[1] & 2) b |= 4; if (pens[1] & 4) b |= 16; if (pens[1] & 8) b |= 1;
            } else if (mode == 2) { // 8 píxeles
                for(let i=0; i<8; i++) if(pens[i] & 1) b |= (1 << (7-i));
            }
            return b;
        }

        function doExport(type) {
            const pixels = document.querySelectorAll('.pixel');
            const data = Array.from(pixels).map(p => parseInt(p.dataset.pen));
            const bytes = [];
            const step = mode == 1 ? 4 : (mode == 0 ? 2 : 8);
            for(let i=0; i<data.length; i+=step) bytes.push(packCpcByte(data.slice(i, i+step)));

            let res = "";
            if(type === 1) {
                res = "10 ' CPC PACKED DATA\n";
                for(let i=0; i<bytes.length; i+=8) res += (20+i) + " DATA " + bytes.slice(i, i+8).map(v => "&"+v.toString(16).toUpperCase()).join(",") + "\n";
            } else if(type === 2) {
                res = "; 8BP / ASM FORMAT\n.mysprite\n";
                for(let i=0; i<bytes.length; i+=12) res += "  DB " + bytes.slice(i, i+12).map(v => "&"+v.toString(16).toUpperCase()).join(",") + "\n";
            } else {
                res = "; BINARY SCR DUMP (Mockup)\n; Use LOAD \"\",&C000\n";
                res += bytes.map(v => v.toString(16).toUpperCase().padStart(2, '0')).join(" ");
            }
            const w = window.open(); w.document.write("<pre>" + res + "</pre>");
            closeExport();
        }

        function showExportMenu() { document.getElementById('export-overlay').style.display = 'flex'; }
        function closeExport() { document.getElementById('export-overlay').style.display = 'none'; }
        function closeAnim() { clearInterval(timer); document.getElementById('anim-overlay').style.display='none'; }
        window.onmouseup = () => drawing = false;
        document.addEventListener("DOMContentLoaded", initGrid);
    </script>
</body>
</html>
